<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; frame-src https://script.google.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E5F8C">
<title>Sistem Persuratan Digital</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  html,body{margin:0;height:100%;background:#0E5F8C;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .4s}
  .loaded #app{opacity:1}
  #splash{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;transition:opacity .4s;pointer-events:none}
  .loaded #splash{opacity:0}
  .sp{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#FFA45E;margin:0 auto 14px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #note{display:none;position:fixed;left:12px;right:12px;bottom:12px;background:#fff;color:#16324A;border-radius:14px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:2}
  .no-cl #note{display:block}
</style>
</head>
<body>
  <div id="splash"><div><div class="sp"></div><b>Sistem Persuratan Digital</b><div style="opacity:.75;font-size:13px;margin-top:4px">Memuat aplikasi…</div></div></div>
  <iframe id="app" title="Sistem Persuratan Digital" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
  <div id="note">Browser ini versi lama. Jika aplikasi tidak terbuka, perbarui Chrome/Edge atau gunakan browser lain.</div>
  <script src="app.js"></script>
</body>
</html>
